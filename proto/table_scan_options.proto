syntax = "proto3";
package datafusion_java;
option java_package = "org.apache.datafusion.protobuf";
option java_multiple_files = true;

// Message presence distinguishes a full scan from an empty projection.
message TableScanProjectionProto {
  repeated uint32 indices = 1;
}

// Expressions travel separately as LogicalExprNode byte arrays.
message TableScanOptionsProto {
  TableScanProjectionProto projection = 1;
  optional int64 limit = 2;
}
